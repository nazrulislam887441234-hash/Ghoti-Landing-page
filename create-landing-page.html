<!DOCTYPE html>
<html lang="bn">
<head>

    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ghoti Landing Page | Create Professional Landing Pages">
    <meta name="twitter:description" content="Create professional product landing pages easily.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://ghotimarket.com/logo/landing.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF6B00;
            --primary-hover: #E05E00;
            --secondary: #FF8C00;
            --dark: #1A1D20;
            --muted: #718096;
            --border: #E2E8F0;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --error-bg: #FDE8E8;
            --error-text: #9B1C1C;
            --success-bg: #DEF7EC;
            --success-text: #03543F;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--dark);
            line-height: 1.6;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header / Logo */
        .app-header {
            background: var(--bg-card);
            padding: 1.25rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--dark);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .brand-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .user-info-badge {
            font-size: 0.875rem;
            color: var(--muted);
            background: #F8FAFC;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        /* Card Container */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        h1, h2 {
            color: var(--dark);
            margin-bottom: 1.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h1 svg, h2 svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }

        /* Notifications & Alerts */
        .alert {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .alert.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #F5C6CB;
            display: flex;
        }

        .alert.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #B7E1CD;
            display: flex;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--dark);
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            background-color: #FAFAFB;
            color: var(--dark);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background-color: #FFF;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        /* Service Status Card for ImgBB */
        .service-status-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .service-status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--success-text);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* Image Upload Section */
        .image-upload-box {
            border: 2px dashed var(--border);
            padding: 2.5rem 1.5rem;
            border-radius: var(--radius);
            text-align: center;
            background: #F8FAFC;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .image-upload-box:hover {
            border-color: var(--primary);
            background: #FFF;
        }

        .image-upload-box input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #fff;
            box-shadow: var(--shadow);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove-img {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .preview-item .remove-img:hover {
            background: #D32F2F;
        }

        .preview-item .remove-img svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }

        .preview-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.65rem;
            text-align: center;
            padding: 2px 0;
            font-weight: 500;
        }

        /* Variant Builder */
        .variant-card {
            background: #F8FAFC;
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .variant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            gap: 10px;
        }

        .variant-values-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .variant-value-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 2px 4px rgba(255, 107, 0, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #EDF2F7;
            color: var(--dark);
            box-shadow: none;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #E2E8F0;
            color: var(--dark);
        }

        .btn-danger {
            background: #FEE2E2;
            color: #9B1C1C;
            padding: 0.5rem 0.85rem;
            font-size: 0.85rem;
            box-shadow: none;
            border: 1px solid #FCA5A5;
        }

        .btn-danger:hover {
            background: #FDC2C2;
            color: #7F1D1D;
        }

        .btn-block {
            width: 100%;
        }

        /* Checkbox Switch */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .switch-container input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* JSON Preview Box */
        .json-preview-wrapper {
            display: none;
            margin-top: 1.5rem;
        }

        pre {
            background: #1A1D20;
            color: #E2E8F0;
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            max-height: 300px;
            border: 1px solid #2D3748;
        }

        svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Toast Notifications Container */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toast {
            background-color: var(--bg-card);
            color: var(--dark);
            border: 1px solid var(--border);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 300px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { border-left: 5px solid #10B981; }
        .toast.error { border-left: 5px solid #EF4444; }
        .toast.success svg { fill: #10B981; }
        .toast.error svg { fill: #EF4444; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <a href="https://ghotimarket.com/" class="brand-logo">
                <img src="https://ghotimarket.com/logo/landing.png" alt="Ghoti Logo">
                <span>Ghoti Landing Page</span>
            </a>
            <div id="userBadge" class="user-info-badge">Checking authorization...</div>
        </header>

        <!-- Main Form Card -->
        <div class="card">
            <h1>
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM10 17l5-5-5-5v10z"/></svg>
                Create New Product Landing Page
            </h1>
            
            <div id="alertBox" class="alert"></div>

            <form id="productForm">
                <!-- ImgBB API Key Locked Configuration Card -->
                <div class="form-group">
                    <label>Image Upload Service</label>
                    <div class="service-status-card">
                        <div class="service-status-indicator">
                            <span class="status-dot"></span>
                            <span>ImgBB Connected & Locked</span>
                        </div>
                        <span style="font-size: 0.8rem; color: var(--muted); font-weight: 500;">Secure Internal Config</span>
                    </div>
                </div>

                <!-- Product Images -->
                <div class="form-group">
                    <label>Product Images (Minimum 1 Required)</label>
                    <div class="image-upload-box" id="dropZone">
                        <svg viewBox="0 0 24 24" style="width: 40px; height: 40px; fill: var(--primary); margin-bottom: 8px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        <p style="font-weight: 600; color: var(--dark);">Click or drag images here to upload</p>
                        <p style="font-size: 0.8rem; color: var(--muted); margin-top: 4px;">Automatic watermark will be applied securely</p>
                        <input type="file" id="imageInput" accept="image/*" multiple>
                    </div>
                    <div class="preview-container" id="previewContainer"></div>
                </div>

                <!-- Product Name & Headline -->
                <div class="row">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g. Premium Cotton Panjabi" required>
                    </div>
                    <div class="form-group">
                        <label>Headline (Optional)</label>
                        <input type="text" id="headLine" placeholder="e.g. আপনার স্টাইল হোক আরও আকর্ষণীয়">
                    </div>
                </div>

                <!-- Pricing -->
                <div class="row">
                    <div class="form-group">
                        <label>Price (BDT) *</label>
                        <input type="number" id="price" min="1" placeholder="850" required>
                    </div>
                    <div class="form-group">
                        <label>Old Price (BDT) (Optional)</label>
                        <input type="number" id="oldPrice" min="0" placeholder="1200">
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label>Product Description *</label>
                    <textarea id="productDescription" placeholder="উচ্চমানের কটন কাপড় দিয়ে তৈরি প্রিমিয়াম পাঞ্জাবি।" required></textarea>
                </div>

                <!-- Variants Section -->
                <div class="form-group">
                    <label>Dynamic Variants (Optional)</label>
                    <div id="variantsContainer"></div>
                    <button type="button" class="btn btn-secondary" id="addVariantBtn" style="margin-top: 10px;">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Add Variant
                    </button>
                </div>

                <!-- Active Status -->
                <div class="form-group" style="margin-top: 1.5rem;">
                    <label class="switch-container">
                        <input type="checkbox" id="activeStatus" checked>
                        <span style="font-weight: 600;">Active Product Status</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-block" id="submitBtn" style="margin-top: 1.5rem;">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Save Product
                </button>
            </form>

            <!-- JSON Preview Section -->
            <div id="jsonPreviewWrapper" class="json-preview-wrapper">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3>Saved Product Data (JSON)</h3>
                    <button type="button" class="btn btn-secondary" id="copyJsonBtn">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy JSON
                    </button>
                </div>
                <pre id="jsonOutput"></pre>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase SDK Modular v10.12.2 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // Firebase Configuration Section
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
            authDomain: "ghotimarket.firebaseapp.com",
            databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
            projectId: "ghotimarket",
            storageBucket: "ghotimarket.firebasestorage.app",
            messagingSenderId: "481257644093",
            appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
            measurementId: "G-4SR8V2EKC1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // ImgBB Configuration & Watermark Setup (Base64 Reliable Fix)
        // ==========================================
        const IMGBB_API_KEY = "077c80395231b77dd1aac6036b151945";
        
        // Embedded transparent watermark Base64 Data URL to completely eliminate CORS/network issues
        const WATERMARK_DATA_URL = "./watermark.png";

        let currentUserData = null;
        let selectedFiles = []; // Stores objects: { file, processedBlob, status }
        let isProcessingOrUploading = false;

        const alertBox = document.getElementById('alertBox');
        const userBadge = document.getElementById('userBadge');
        const previewContainer = document.getElementById('previewContainer');
        const productForm = document.getElementById('productForm');
        const submitBtn = document.getElementById('submitBtn');
        const variantsContainer = document.getElementById('variantsContainer');

        function showAlert(message, type = 'error') {
            alertBox.className = `alert ${type}`;
            alertBox.textContent = message;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            showToast(message, type);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const iconSvg = type === 'success' 
                ? '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';

            toast.innerHTML = `${iconSvg} <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ==========================================
        // 1. Authentication & Authorization Check
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                const userDocRef = doc(db, "landing_users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (!userDocSnap.exists()) {
                    showAlert("আপনার অ্যাকাউন্ট এই কাজের জন্য অনুমোদিত নয়। (Document missing)");
                    return;
                }

                const data = userDocSnap.data();
                
                if (data.uid !== user.uid || data.email !== user.email || data.active !== true || data.verified !== true) {
                    showAlert("আপনার অ্যাকাউন্ট শর্ত পূরণ করছে না বা নিষ্ক্রিয় রয়েছে।");
                    return;
                }

                currentUserData = data;
                userBadge.textContent = `${data.name} (${data.email})`;
            } catch (error) {
                console.error(error);
                showAlert("অথেন্টিকেশন যাচাই করতে সমস্যা হয়েছে।");
            }
        });

        // ==========================================
        // Image Processing & Watermark Engine (CORS-Free Base64 Solution)
        // ==========================================
        async function processImageWithWatermark(file) {
            // Load Watermark Image Object directly from Base64 Data URL (No CORS fetch needed)
            const watermarkImg = await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.error("Watermark decode failed");
                    reject(new Error("Watermark load failed"));
                };
                img.src = WATERMARK_DATA_URL;
            });

            // Decode Main Uploaded Image via createImageBitmap or Image element
            let sourceImageBitmap;
            try {
                if (window.createImageBitmap) {
                    sourceImageBitmap = await createImageBitmap(file);
                } else {
                    throw new Error("createImageBitmap not supported");
                }
            } catch (e) {
                // Fallback to Image element + FileReader
                sourceImageBitmap = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = () => {
                            console.error("Image decode failed");
                            reject(new Error("Image decode failed"));
                        };
                        img.src = e.target.result;
                    };
                    reader.onerror = () => {
                        console.error("File reading failed");
                        reject(new Error("Image decode failed"));
                    };
                    reader.readAsDataURL(file);
                });
            }

            // Canvas Creation & Processing
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error("Canvas creation failed");
                throw new Error("Canvas creation failed");
            }

            let width = sourceImageBitmap.width || sourceImageBitmap.naturalWidth;
            let height = sourceImageBitmap.height || sourceImageBitmap.naturalHeight;
            const maxDim = 1200;

            if (width > maxDim || height > maxDim) {
                if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }
            }

            canvas.width = width;
            canvas.height = height;

            // Draw original image
            try {
                ctx.drawImage(sourceImageBitmap, 0, 0, width, height);
            } catch (drawErr) {
                console.error("Canvas drawing failed:", drawErr);
                throw new Error("Canvas drawing related error");
            }

            // Calculate Watermark dimensions (approx 22% of image width)
            const wmWidth = Math.round(width * 0.22);
            const wmHeight = Math.round((watermarkImg.height * wmWidth) / watermarkImg.width);

            // Position: Bottom-Right with ~3% padding
            const padding = Math.round(width * 0.03);
            const wmX = width - wmWidth - padding;
            const wmY = height - wmHeight - padding;

            // Apply transparency (~0.85) & draw watermark
            ctx.globalAlpha = 0.85;
            ctx.drawImage(watermarkImg, wmX, wmY, wmWidth, wmHeight);
            ctx.globalAlpha = 1.0; // Reset

            // Generate WebP Blob
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        console.error("Canvas toBlob failed");
                        reject(new Error("Canvas toBlob failed"));
                    }
                }, "image/webp", 0.90);
            });
        }

        // ==========================================
        // Image Selection & Processing Pipeline
        // ==========================================
        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Processing Images...";

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;

                const fileObj = {
                    file: file,
                    processedBlob: null,
                    previewUrl: URL.createObjectURL(file),
                    status: "processing"
                };
                selectedFiles.push(fileObj);
                renderPreviews();

                try {
                    const processedBlob = await processImageWithWatermark(file);
                    fileObj.processedBlob = processedBlob;
                    fileObj.previewUrl = URL.createObjectURL(processedBlob);
                    fileObj.status = "processed";
                } catch (err) {
                    console.error("Processing Error for file:", file.name, err);
                    fileObj.status = "error";
                    showToast(`Image processing failed for ${file.name}`, "error");
                }
                renderPreviews();
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Save Product`;
            imageInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedFiles.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                let statusText = "Processing...";
                if (item.status === "processed") statusText = "Watermarked";
                if (item.status === "error") statusText = "Error";

                div.innerHTML = `
                    <img src="${item.previewUrl}" alt="Preview">
                    <div class="preview-status">${statusText}</div>
                    <button type="button" class="remove-img" data-index="${index}" title="Remove">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                `;
                div.querySelector('.remove-img').addEventListener('click', () => {
                    if (item.previewUrl) {
                        URL.revokeObjectURL(item.previewUrl);
                    }
                    selectedFiles.splice(index, 1);
                    renderPreviews();
                });
                previewContainer.appendChild(div);
            });
        }

        // ==========================================
        // Dynamic Variant System
        // ==========================================
        document.getElementById('addVariantBtn').addEventListener('click', () => {
            const variantId = Date.now();
            const div = document.createElement('div');
            div.className = 'variant-card';
            div.dataset.id = variantId;
            div.innerHTML = `
                <div class="variant-header">
                    <input type="text" placeholder="Variant Name (e.g. সাইজ / রং)" class="variant-name" required style="flex: 1;">
                    <button type="button" class="btn btn-danger remove-variant">Remove Variant</button>
                </div>
                <div class="variant-values-container">
                    <div class="variant-value-row">
                        <input type="text" placeholder="Value (e.g. M)" class="v-value" required style="flex: 2;">
                        <input type="number" placeholder="Extra Price" class="v-price" value="0" min="0" required style="flex: 1;">
                        <button type="button" class="btn btn-danger remove-value" style="padding: 10px;">×</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary add-value-btn" style="margin-top: 8px; font-size: 0.85rem; padding: 6px 12px;">+ Add Value</button>
            `;

            div.querySelector('.remove-variant').addEventListener('click', () => div.remove());
            div.querySelector('.add-value-btn').addEventListener('click', () => {
                const valRow = document.createElement('div');
                valRow.className = 'variant-value-row';
                valRow.innerHTML = `
                    <input type="text" placeholder="Value" class="v-value" required style="flex: 2;">
                    <input type="number" placeholder="Extra Price" class="v-price" value="0" min="0" required style="flex: 1;">
                    <button type="button" class="btn btn-danger remove-value" style="padding: 10px;">×</button>
                `;
                valRow.querySelector('.remove-value').addEventListener('click', () => valRow.remove());
                div.querySelector('.variant-values-container').appendChild(valRow);
            });

            div.querySelector('.remove-value').addEventListener('click', (e) => {
                if (div.querySelectorAll('.variant-value-row').length > 1) {
                    e.target.closest('.variant-value-row').remove();
                }
            });

            variantsContainer.appendChild(div);
        });

        // ==========================================
        // Slug Generation & Uniqueness Check
        // ==========================================
        function generateSlug(text) {
            return text.toString().toLowerCase()
                .trim()
                .replace(/\s+/g, '-')
                .replace(/[^\w\u0980-\u09FF\-]+/g, '')
                .replace(/\-\-+/g, '-');
        }

        async function getUniqueSlug(baseSlug) {
            let slug = baseSlug;
            let counter = 1;
            let exists = true;

            while (exists) {
                const q = query(collection(db, "landing_product"), where("productSlug", "==", slug));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    exists = false;
                } else {
                    counter++;
                    slug = `${baseSlug}-${counter}`;
                }
            }
            return slug;
        }

        // ==========================================
        // ImgBB Upload Function (Watermarked Files)
        // ==========================================
        async function uploadImagesToImgBB() {
            const uploadedUrls = [];
            let count = 1;
            for (const item of selectedFiles) {
                if (!item.processedBlob) {
                    throw new Error("Some images are still processing or failed.");
                }
                submitBtn.textContent = `Uploading Images (${count}/${selectedFiles.length})...`;
                
                const formData = new FormData();
                formData.append('image', item.processedBlob, item.file.name);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    uploadedUrls.push(result.data.url);
                } else {
                    throw new Error("Watermarked image upload failed. Please try again.");
                }
                count++;
            }
            return uploadedUrls;
        }

        // ==========================================
        // Form Submit Handler
        // ==========================================
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isProcessingOrUploading) return;

            if (!currentUserData) {
                showAlert("অনুমোদন যাচাই করা হয়নি।");
                return;
            }

            if (selectedFiles.length === 0) {
                showAlert("কমপক্ষে একটি প্রোডাক্ট ইমেজ বাধ্যতামূলক।");
                return;
            }

            for (const item of selectedFiles) {
                if (item.status === "processing") {
                    showAlert("ইমেজ প্রসেসিং শেষ হওয়ার জন্য অপেক্ষা করুন।");
                    return;
                }
                if (item.status === "error") {
                    showAlert("কিছু ইমেজে সমস্যা রয়েছে। দয়া করে সেগুলো সরিয়ে পুনরায় দিন।");
                    return;
                }
            }

            const productName = document.getElementById('productName').value.trim();
            const productDescription = document.getElementById('productDescription').value.trim();
            const price = Number(document.getElementById('price').value);
            const oldPriceVal = document.getElementById('oldPrice').value;
            const oldPrice = oldPriceVal ? Number(oldPriceVal) : null;
            const headLine = document.getElementById('headLine').value.trim() || null;
            const active = document.getElementById('activeStatus').checked;

            if (!productName || !productDescription || isNaN(price) || price <= 0) {
                showAlert("সব প্রয়োজনীয় ক্ষেত্র সঠিক তথ্য দিয়ে পূরণ করুন।");
                return;
            }

            const variants = [];
            const variantCards = variantsContainer.querySelectorAll('.variant-card');
            for (const card of variantCards) {
                const vName = card.querySelector('.variant-name').value.trim();
                if (!vName) {
                    showAlert("Variant Name খালি রাখা যাবে না।");
                    return;
                }
                const values = [];
                const valRows = card.querySelectorAll('.variant-value-row');
                for (const row of valRows) {
                    const valText = row.querySelector('.v-value').value.trim();
                    const extraP = Number(row.querySelector('.v-price').value);
                    if (!valText || isNaN(extraP)) {
                        showAlert("Variant Value অথবা Extra Price সঠিক নয়।");
                        return;
                    }
                    values.push({ value: valText, extraPrice: extraP });
                }
                variants.push({ name: vName, values: values });
            }

            isProcessingOrUploading = true;
            submitBtn.disabled = true;
            submitBtn.textContent = "Uploading Watermarked Images...";

            try {
                const imageUrls = await uploadImagesToImgBB();

                submitBtn.textContent = "Generating Unique Slug...";
                let baseSlug = generateSlug(productName);
                if (!baseSlug) baseSlug = "product-" + Date.now();
                const productSlug = await getUniqueSlug(baseSlug);

                submitBtn.textContent = "Saving Product to Database...";

                const productData = {
                    productImage: imageUrls,
                    productName: productName,
                    productDescription: productDescription,
                    price: price,
                    oldPrice: oldPrice,
                    headLine: headLine,
                    variants: variants,
                    productSlug: productSlug,
                    uid: currentUserData.uid,
                    email: currentUserData.email,
                    active: active,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "landing_product"), productData);

                showAlert("প্রোডাক্ট সফলভাবে সংরক্ষণ করা হয়েছে!", "success");
                
                productData.createdAt = "Firestore Server Timestamp";
                document.getElementById('jsonOutput').textContent = JSON.stringify(productData, null, 2);
                document.getElementById('jsonPreviewWrapper').style.display = "block";

                document.getElementById('copyJsonBtn').onclick = () => {
                    navigator.clipboard.writeText(JSON.stringify(productData, null, 2));
                    showToast("JSON copied successfully", "success");
                };

                setTimeout(() => {
                    window.location.href = "success.html";
                }, 500);

            } catch (error) {
                console.error(error);
                showAlert(error.message || "Product save করা যায়নি। আবার চেষ্টা করুন।");
                isProcessingOrUploading = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Save Product`;
            }
        });
    </script>
</body>
